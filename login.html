<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdGuardian - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white">AdGuardian</h1>
            <p class="text-gray-400 text-sm mt-1">Ad Budget Monitoring</p>
        </div>
        
        <!-- Auth Card -->
        <div class="bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 p-8">
            
            <!-- Tabs -->
            <div class="flex bg-white/5 rounded-lg p-1 mb-6">
                <button id="loginTab" class="flex-1 py-2.5 px-4 rounded-md text-sm font-medium transition-all bg-white/10 text-white">
                    Sign In
                </button>
                <button id="registerTab" class="flex-1 py-2.5 px-4 rounded-md text-sm font-medium transition-all text-gray-400 hover:text-white">
                    Create Account
                </button>
            </div>
            
            <!-- Alert -->
            <div id="alert" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
            
            <!-- Login Form -->
            <form id="loginForm">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
                        <input type="email" id="loginEmail" required
                            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
                            placeholder="you@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
                        <input type="password" id="loginPassword" required
                            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
                            placeholder="••••••••">
                    </div>
                </div>
                
                <button type="submit" id="loginBtn"
                    class="w-full mt-6 py-3 px-4 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium rounded-lg hover:from-indigo-600 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-900 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                    Sign In
                </button>
                
                <div class="mt-4 text-center">
                    <a href="#" id="forgotLink" class="text-sm text-indigo-400 hover:text-indigo-300">Forgot password?</a>
                </div>
            </form>
            
            <!-- Register Form (hidden by default) -->
            <form id="registerForm" class="hidden">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
                        <input type="email" id="registerEmail" required
                            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
                            placeholder="you@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
                        <input type="password" id="registerPassword" required minlength="6"
                            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
                            placeholder="Min 6 characters">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1.5">Confirm Password</label>
                        <input type="password" id="confirmPassword" required
                            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all"
                            placeholder="••••••••">
                    </div>
                </div>
                
                <button type="submit" id="registerBtn"
                    class="w-full mt-6 py-3 px-4 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium rounded-lg hover:from-indigo-600 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-900 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                    Create Account
                </button>
            </form>
        </div>
        
        <!-- Footer -->
        <p class="text-center text-gray-500 text-xs mt-6">
            © 2026 AdGuardian · <a href="/privacy.html" class="hover:text-gray-400">Privacy</a> · <a href="/terms.html" class="hover:text-gray-400">Terms</a>
        </p>
    </div>
    
    <script>
        // ============================================
        // SUPABASE CONFIG
        // ============================================
        const SUPABASE_URL = 'https://jprnvftdfnhsfeuoxkkh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impwcm52ZnRkZm5oc2ZldW94a2toIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzOTE3MTUsImV4cCI6MjA4ODk2NzcxNX0.YqJcKE-GJPCdo6nNly4FTOMHx_N0Bvj4-DIFcoU6-Hk';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // ============================================
        // DOM ELEMENTS
        // ============================================
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const alert = document.getElementById('alert');
        const forgotLink = document.getElementById('forgotLink');
        
        // ============================================
        // TAB SWITCHING
        // ============================================
        loginTab.addEventListener('click', () => {
            loginTab.classList.add('bg-white/10', 'text-white');
            loginTab.classList.remove('text-gray-400');
            registerTab.classList.remove('bg-white/10', 'text-white');
            registerTab.classList.add('text-gray-400');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            hideAlert();
        });
        
        registerTab.addEventListener('click', () => {
            registerTab.classList.add('bg-white/10', 'text-white');
            registerTab.classList.remove('text-gray-400');
            loginTab.classList.remove('bg-white/10', 'text-white');
            loginTab.classList.add('text-gray-400');
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            hideAlert();
        });
        
        // ============================================
        // ALERT FUNCTIONS
        // ============================================
        function showAlert(message, type = 'error') {
            alert.textContent = message;
            alert.className = `mb-4 p-3 rounded-lg text-sm ${type === 'error' ? 'bg-red-500/20 text-red-300 border border-red-500/30' : 'bg-green-500/20 text-green-300 border border-green-500/30'}`;
            alert.classList.remove('hidden');
        }
        
        function hideAlert() {
            alert.classList.add('hidden');
        }
        
        function setLoading(btn, loading) {
            btn.disabled = loading;
            btn.textContent = loading ? 'Please wait...' : (btn.id === 'loginBtn' ? 'Sign In' : 'Create Account');
        }
        
        // ============================================
        // LOGIN
        // ============================================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            
            if (!email || !password) {
                showAlert('Please fill in all fields.');
                return;
            }
            
            setLoading(btn, true);
            
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });
                
                if (error) {
                    showAlert(error.message);
                    setLoading(btn, false);
                    return;
                }
                
                showAlert('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 500);
                
            } catch (err) {
                showAlert('An error occurred. Please try again.');
                setLoading(btn, false);
            }
        });
        
        // ============================================
        // REGISTER
        // ============================================
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('registerBtn');
            
            if (!email || !password || !confirm) {
                showAlert('Please fill in all fields.');
                return;
            }
            
            if (password.length < 6) {
                showAlert('Password must be at least 6 characters.');
                return;
            }
            
            if (password !== confirm) {
                showAlert('Passwords do not match.');
                return;
            }
            
            setLoading(btn, true);
            
            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: {
                        emailRedirectTo: `${window.location.origin}/dashboard.html`
                    }
                });
                
                if (error) {
                    showAlert(error.message);
                    setLoading(btn, false);
                    return;
                }
                
                if (data.user && !data.session) {
                    showAlert('Check your email to confirm your account!', 'success');
                } else if (data.session) {
                    showAlert('Account created! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 500);
                }
                
                setLoading(btn, false);
                
            } catch (err) {
                showAlert('An error occurred. Please try again.');
                setLoading(btn, false);
            }
        });
        
        // ============================================
        // FORGOT PASSWORD
        // ============================================
        forgotLink.addEventListener('click', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            
            if (!email) {
                showAlert('Enter your email first, then click Forgot password.');
                return;
            }
            
            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: `${window.location.origin}/reset-password.html`
                });
                
                showAlert('If an account exists, you will receive a reset email.', 'success');
            } catch (err) {
                showAlert('An error occurred. Please try again.');
            }
        });
        
        // ============================================
        // CHECK SESSION ON LOAD
        // ============================================
        (async function() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = '/dashboard.html';
            }
        })();
    </script>
</body>
</html>
