<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AdGuardian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-[#030712] min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-2.5">
                <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                </div>
                <span class="text-white font-bold text-xl">AdGuardian</span>
            </a>
        </div>

        <!-- Card -->
        <div class="bg-white/[0.03] border border-white/10 rounded-2xl p-8">
            <!-- Request Form (shown initially) -->
            <div id="requestForm">
                <h1 class="text-2xl font-bold text-white mb-2">Forgot your password?</h1>
                <p class="text-gray-400 mb-6">Enter your email and we'll send you a reset link.</p>

                <form id="forgotPasswordForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            required
                            class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-colors"
                            placeholder="you@company.com"
                        >
                    </div>

                    <button 
                        type="submit" 
                        id="submitBtn"
                        class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold rounded-xl hover:opacity-90 transition-opacity flex items-center justify-center gap-2"
                    >
                        <span>Send Reset Link</span>
                        <svg class="w-4 h-4 hidden animate-spin" id="spinner" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </form>

                <div id="errorMessage" class="hidden mt-4 p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm"></div>
            </div>

            <!-- Success Message (shown after email sent) -->
            <div id="successMessage" class="hidden text-center">
                <div class="w-16 h-16 bg-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <h2 class="text-xl font-bold text-white mb-2">Check your email</h2>
                <p class="text-gray-400 mb-6">We've sent a password reset link to <span id="sentEmail" class="text-white font-medium"></span></p>
                <p class="text-sm text-gray-500">Didn't receive the email? Check your spam folder or <a href="#" id="resendLink" class="text-indigo-400 hover:text-indigo-300">try again</a></p>
            </div>
        </div>

        <!-- Back to login -->
        <p class="text-center mt-6 text-gray-500 text-sm">
            Remember your password? 
            <a href="/login" class="text-indigo-400 hover:text-indigo-300 font-medium">Sign in</a>
        </p>
    </div>

    <script>
        const SUPABASE_URL = 'https://jprnvftdfnhsfeuoxkkh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impwcm52ZnRkZm5oc2ZldW94a2toIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzOTE3MTUsImV4cCI6MjA4ODk2NzcxNX0.YqJcKE-GJPCdo6nNly4FTOMHx_N0Bvj4-DIFcoU6-Hk';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('forgotPasswordForm');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const errorMessage = document.getElementById('errorMessage');
        const requestForm = document.getElementById('requestForm');
        const successMessage = document.getElementById('successMessage');
        const sentEmail = document.getElementById('sentEmail');
        const resendLink = document.getElementById('resendLink');

        let userEmail = '';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            userEmail = document.getElementById('email').value;
            
            // Show loading
            submitBtn.disabled = true;
            spinner.classList.remove('hidden');
            errorMessage.classList.add('hidden');

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(userEmail, {
                    redirectTo: `${window.location.origin}/reset-password`
                });

                if (error) throw error;

                // Show success
                requestForm.classList.add('hidden');
                successMessage.classList.remove('hidden');
                sentEmail.textContent = userEmail;

            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = error.message || 'Failed to send reset email. Please try again.';
                errorMessage.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                spinner.classList.add('hidden');
            }
        });

        // Resend link
        resendLink.addEventListener('click', (e) => {
            e.preventDefault();
            successMessage.classList.add('hidden');
            requestForm.classList.remove('hidden');
            document.getElementById('email').value = userEmail;
        });
    </script>
</body>
</html>
