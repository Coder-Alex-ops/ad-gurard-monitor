<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AdGuardian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white">AdGuardian</h1>
        </div>

        <!-- Card -->
        <div class="bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 p-8">
            
            <!-- Loading -->
            <div id="loading" class="text-center py-8">
                <div class="w-10 h-10 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-gray-400">Verifying link...</p>
            </div>

            <!-- Form -->
            <div id="formSection" class="hidden">
                <h2 class="text-xl font-bold text-white mb-2">Set new password</h2>
                <p class="text-gray-400 text-sm mb-6">Enter your new password below.</p>
                
                <div id="alert" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
                
                <form id="resetForm">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1.5">New Password</label>
                            <input type="password" id="password" required minlength="6"
                                class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-all"
                                placeholder="Min 6 characters">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1.5">Confirm Password</label>
                            <input type="password" id="confirmPassword" required
                                class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition-all"
                                placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" id="submitBtn"
                        class="w-full mt-6 py-3 px-4 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium rounded-lg hover:from-indigo-600 hover:to-purple-700 transition-all disabled:opacity-50">
                        Update Password
                    </button>
                </form>
            </div>

            <!-- Success -->
            <div id="success" class="hidden text-center">
                <div class="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h2 class="text-xl font-bold text-white mb-2">Password Updated!</h2>
                <p class="text-gray-400 mb-6">You can now sign in with your new password.</p>
                <a href="/login" class="block w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium rounded-lg text-center">
                    Go to Login
                </a>
            </div>

            <!-- Error -->
            <div id="error" class="hidden text-center">
                <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </div>
                <h2 class="text-xl font-bold text-white mb-2">Invalid or Expired Link</h2>
                <p class="text-gray-400 mb-6">Please request a new password reset.</p>
                <a href="/login" class="block w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium rounded-lg text-center">
                    Back to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        // SUPABASE CONFIG - ПРАВИЛЕН КЛЮЧ
        const SUPABASE_URL = 'https://jprnvftdfnhsfeuoxkkh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impwcm52ZnRkZm5oc2ZldW94a2toIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzOTE3MTUsImV4cCI6MjA4ODk2NzcxNX0.YqJcKE-GJPCdo6nNly4FTOMHx_N0Bvj4-DIFcoU6-Hk';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loading = document.getElementById('loading');
        const formSection = document.getElementById('formSection');
        const success = document.getElementById('success');
        const error = document.getElementById('error');
        const alert = document.getElementById('alert');
        const form = document.getElementById('resetForm');

        function showAlert(msg, type = 'error') {
            alert.textContent = msg;
            alert.className = `mb-4 p-3 rounded-lg text-sm ${type === 'error' ? 'bg-red-500/20 text-red-300 border border-red-500/30' : 'bg-green-500/20 text-green-300 border border-green-500/30'}`;
            alert.classList.remove('hidden');
        }

        // Initialize
        async function init() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');
            const type = params.get('type');

            if (type === 'recovery' && accessToken) {
                try {
                    const { error: sessionError } = await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });

                    if (sessionError) throw sessionError;

                    loading.classList.add('hidden');
                    formSection.classList.remove('hidden');
                } catch (e) {
                    console.error(e);
                    loading.classList.add('hidden');
                    error.classList.remove('hidden');
                }
            } else {
                loading.classList.add('hidden');
                error.classList.remove('hidden');
            }
        }

        init();

        // Form submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');

            if (password !== confirm) {
                showAlert('Passwords do not match.');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const { error: updateError } = await supabaseClient.auth.updateUser({ password });

                if (updateError) throw updateError;

                await supabaseClient.auth.signOut();
                formSection.classList.add('hidden');
                success.classList.remove('hidden');

            } catch (e) {
                showAlert(e.message || 'Failed to update password.');
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>
