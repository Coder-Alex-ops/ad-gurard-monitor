<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AdGuard Budget Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>* { font-family: 'DM Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen">
    
    <!-- Not Connected State -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white rounded-2xl border border-slate-200 p-10 max-w-md w-full text-center shadow-lg">
            <div class="w-16 h-16 bg-gradient-to-br from-indigo-600 to-violet-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-indigo-500/30">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 mb-2">AdGuard Budget Monitor</h1>
            <p class="text-slate-500 mb-8">Connect your Meta Ads account to start monitoring your ad spend.</p>
            
            <button onclick="connectMeta()" class="w-full flex items-center justify-center gap-3 px-6 py-4 bg-[#1877F2] text-white font-semibold rounded-xl hover:bg-[#166FE5] transition-colors shadow-lg shadow-blue-500/30">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                Connect with Meta
            </button>
            
            <p class="text-xs text-slate-400 mt-6">We only read your ad spend data. We never post anything.</p>
        </div>
    </div>

    <!-- Connected State (Hidden by default) -->
    <div id="dashboard-section" class="hidden">
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 px-6 py-4">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-600 to-violet-600 rounded-xl flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                        </svg>
                    </div>
                    <span class="font-bold text-slate-900 text-lg">AdGuard</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="user-name" class="text-sm text-slate-600"></span>
                    <button onclick="logout()" class="text-sm text-red-600 hover:text-red-700 font-medium">Logout</button>
                </div>
            </div>
        </header>

        <!-- Dashboard Content -->
        <main class="max-w-7xl mx-auto p-6">
            <h1 class="text-2xl font-bold text-slate-900 mb-6">Your Ad Accounts</h1>
            
            <!-- Loading -->
            <div id="loading" class="bg-white rounded-2xl border border-slate-200 p-12 text-center">
                <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-slate-500">Loading your ad accounts...</p>
            </div>

            <!-- Ad Accounts List -->
            <div id="accounts-list" class="hidden space-y-4"></div>

            <!-- No Accounts -->
            <div id="no-accounts" class="hidden bg-white rounded-2xl border border-slate-200 p-12 text-center">
                <svg class="w-12 h-12 text-slate-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                </svg>
                <p class="text-slate-500">No ad accounts found. Make sure you have access to Meta Ads accounts.</p>
            </div>

            <!-- Error -->
            <div id="error-message" class="hidden bg-red-50 border border-red-200 rounded-2xl p-6 text-center">
                <p class="text-red-600" id="error-text"></p>
            </div>
        </main>
    </div>

    <script>
        // Your Meta App ID
        const META_APP_ID = '1237093665238006';
        const REDIRECT_URI = 'https://ad-gurard-monitor.vercel.app/auth/callback';
        
        let accessToken = null;

        // Check if we're returning from OAuth
        window.onload = function() {
            // Check localStorage for existing token
            const savedToken = localStorage.getItem('meta_access_token');
            if (savedToken) {
                accessToken = savedToken;
                showDashboard();
                loadAdAccounts();
            }

            // Check URL for auth code (OAuth callback)
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                // For now, show message that we got the code
                alert('Authorization successful! Code received: ' + code.substring(0, 20) + '...\n\nNote: To exchange this for an access token, we need a backend server. For now, we\'ll use the Graph API Explorer token.');
                window.history.replaceState({}, document.title, '/dashboard.html');
            }
        };

        function connectMeta() {
            const scope = 'ads_read,ads_management,business_management';
            const authUrl = `https://www.facebook.com/v19.0/dialog/oauth?client_id=${META_APP_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${scope}&response_type=code`;
            window.location.href = authUrl;
        }

        function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('meta_access_token');
            accessToken = null;
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }

        async function loadAdAccounts() {
            const loading = document.getElementById('loading');
            const accountsList = document.getElementById('accounts-list');
            const noAccounts = document.getElementById('no-accounts');
            const errorMessage = document.getElementById('error-message');

            try {
                const response = await fetch(`https://graph.facebook.com/v19.0/me/adaccounts?fields=id,name,account_status,amount_spent,balance,currency,spend_cap&access_token=${accessToken}`);
                const data = await response.json();

                loading.classList.add('hidden');

                if (data.error) {
                    throw new Error(data.error.message);
                }

                if (!data.data || data.data.length === 0) {
                    noAccounts.classList.remove('hidden');
                    return;
                }

                // Display accounts
                accountsList.innerHTML = data.data.map(account => `
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 hover:shadow-lg transition-shadow">
                        <div class="flex items-start justify-between mb-4">
                            <div>
                                <h3 class="font-semibold text-slate-900 text-lg">${account.name}</h3>
                                <p class="text-sm text-slate-500">ID: ${account.id}</p>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-medium ${account.account_status === 1 ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}">
                                ${account.account_status === 1 ? 'Active' : 'Inactive'}
                            </span>
                        </div>
                        <div class="grid grid-cols-3 gap-4">
                            <div class="bg-slate-50 rounded-xl p-4">
                                <p class="text-sm text-slate-500 mb-1">Total Spent</p>
                                <p class="text-xl font-bold text-slate-900">$${(parseInt(account.amount_spent || 0) / 100).toFixed(2)}</p>
                            </div>
                            <div class="bg-slate-50 rounded-xl p-4">
                                <p class="text-sm text-slate-500 mb-1">Balance</p>
                                <p class="text-xl font-bold text-slate-900">$${(parseInt(account.balance || 0) / 100).toFixed(2)}</p>
                            </div>
                            <div class="bg-slate-50 rounded-xl p-4">
                                <p class="text-sm text-slate-500 mb-1">Currency</p>
                                <p class="text-xl font-bold text-slate-900">${account.currency}</p>
                            </div>
                        </div>
                        <button onclick="viewCampaigns('${account.id}')" class="mt-4 w-full py-3 bg-indigo-50 text-indigo-600 font-semibold rounded-xl hover:bg-indigo-100 transition-colors">
                            View Campaigns
                        </button>
                    </div>
                `).join('');

                accountsList.classList.remove('hidden');

            } catch (error) {
                loading.classList.add('hidden');
                errorMessage.classList.remove('hidden');
                document.getElementById('error-text').textContent = error.message;
            }
        }

        async function viewCampaigns(accountId) {
            alert('Campaign view coming soon! Account: ' + accountId);
        }

        // Manual token input for testing (since we don't have backend yet)
        function setTestToken() {
            const token = prompt('Enter your Meta Access Token (from Graph API Explorer):');
            if (token) {
                localStorage.setItem('meta_access_token', token);
                accessToken = token;
                showDashboard();
                loadAdAccounts();
            }
        }
    </script>

    <!-- Temporary: Manual token button for testing -->
    <button onclick="setTestToken()" class="fixed bottom-4 right-4 px-4 py-2 bg-slate-800 text-white text-sm rounded-lg hover:bg-slate-700">
        🔧 Set Test Token
    </button>

</body>
</html>
