<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting... - AdGuardian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>* { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-slate-800 rounded-2xl border border-slate-700 p-8 max-w-md w-full text-center">
        <!-- Logo -->
        <div class="flex items-center justify-center gap-3 mb-8">
            <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center">
                <span class="text-white font-bold text-lg">AG</span>
            </div>
            <span class="text-white font-semibold text-xl">AdGuardian</span>
        </div>
        
        <!-- Loading State -->
        <div id="loading">
            <div class="w-12 h-12 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mx-auto mb-4"></div>
            <h1 class="text-xl font-bold text-white mb-2">Connecting Your Account</h1>
            <p class="text-slate-400">Please wait while we connect your Meta Ads account...</p>
        </div>
        
        <!-- Success State -->
        <div id="success" class="hidden">
            <div class="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-white mb-2">Successfully Connected!</h1>
            <p class="text-slate-400 mb-2">Your Meta Ads account is now linked.</p>
            <p class="text-emerald-400 text-sm" id="accountCount"></p>
            <p class="text-slate-500 text-sm mt-4">Redirecting to dashboard...</p>
        </div>
        
        <!-- Error State -->
        <div id="error" class="hidden">
            <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-white mb-2">Connection Failed</h1>
            <p class="text-slate-400 mb-6" id="errorMessage">Something went wrong. Please try again.</p>
            <a href="/dashboard" class="inline-block px-6 py-3 bg-indigo-500 hover:bg-indigo-600 text-white font-medium rounded-lg transition-colors">
                Back to Dashboard
            </a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jprnvftdfnhsfeuoxkkh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impwcm52ZnRkZm5oc2ZldW94a2toIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzOTE3MTUsImV4cCI6MjA4ODk2NzcxNX0.YqJcKE-GJPCdo6nNly4FTOMHx_N0Bvj4-DIFcoU6-Hk';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showState(state) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('success').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById(state).classList.remove('hidden');
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            showState('error');
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const success = urlParams.get('success');
            const error = urlParams.get('error');
            const accounts = urlParams.get('accounts');
            const code = urlParams.get('code');

            // If we have a code, redirect to API to process it
            if (code) {
                window.location.href = '/api/auth/callback?code=' + encodeURIComponent(code);
                return;
            }

            // Handle success from API redirect
            if (success === 'true') {
                // Link meta connection to current user
                const { data: { session } } = await supabaseClient.auth.getSession();
                
                if (session) {
                    const metaUserId = getCookie('meta_user_id');
                    
                    if (metaUserId) {
                        // Update the meta_connection to link to this user
                        await supabaseClient
                            .from('meta_connections')
                            .update({ user_id: session.user.id })
                            .eq('meta_user_id', metaUserId);
                    }
                }

                // Show success
                if (accounts) {
                    document.getElementById('accountCount').textContent = `Found ${accounts} ad account(s)`;
                }
                showState('success');
                
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 2000);
                return;
            }

            // Handle error
            if (error) {
                showError(decodeURIComponent(error));
                return;
            }

            // No parameters - show error
            showError('Invalid callback. Please try connecting again.');
        }

        handleCallback();
    </script>
</body>
</html>
